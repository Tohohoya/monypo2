name: Run PHPUnit

on:
  push:
    branches: [ fix/tests-createapplication ]
  pull_request:
    branches: [ deploy ]

jobs:
  phpunit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo_mysql, pdo_sqlite, zip, xml
          coverage: none

      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y sqlite3

      - name: Install Composer dependencies
        run: composer install --no-progress --no-suggest --prefer-dist

      - name: Prepare .env.testing
        run: |
          cp .env.example .env
          php artisan key:generate --ansi
          mkdir -p database
          touch database/testing.sqlite
          php -r "file_put_contents('.env', str_replace(['DB_CONNECTION=mysql','DB_DATABASE=laravel'], ['DB_CONNECTION=sqlite','DB_DATABASE='.realpath('database/testing.sqlite')], file_get_contents('.env')));"

      - name: Run migrations
        run: php artisan migrate --force

      - name: Run PHPUnit
        run: ./vendor/bin/phpunit --configuration phpunit.xml --colors=always