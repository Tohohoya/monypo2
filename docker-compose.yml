services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: monypo2-app
    ports:
      - "8000:8000"
      - "5173:5173"  # Vite HMR
    volumes:
      - .:/var/www/html
      - /var/www/html/vendor
      - /var/www/html/node_modules
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
      - DB_CONNECTION=mysql
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=monypo2
      - DB_USERNAME=monypo2_user
      - DB_PASSWORD=secret
    depends_on:
      db:
        condition: service_healthy
    networks:
      - monypo2-network
    command: /usr/local/bin/docker-entrypoint.sh

  db:
    image: mysql:8.0
    container_name: monypo2-db
    ports:
      - "3306:3306"
    environment:
      - MYSQL_DATABASE=monypo2
      - MYSQL_USER=monypo2_user
      - MYSQL_PASSWORD=secret
      - MYSQL_ROOT_PASSWORD=root_secret
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot_secret"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - monypo2-network

volumes:
  db-data:
    driver: local

networks:
  monypo2-network:
    driver: bridge
